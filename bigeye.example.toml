# Sentinel-BigEye settings. Copy to ~/.config/sentinel-bigeye/bigeye.toml and fill in.
# Every key is optional; what you leave out uses the default shown here.

[paths]
save_root = "~/Videos/Sentinel-BigEye"        # snapshots, recordings, motion clips, reports
log_file = "~/.cache/sentinel-bigeye.log"
settings_file = "~/.config/sentinel-bigeye/settings.json"   # written by the page (zones, favourites, ...)

[notify]
ntfy_url = ""                                  # your own ntfy server, e.g. "http://192.0.2.10:8099"; empty = no phone messages
topic_file = "~/.config/sentinel-bigeye/ntfy-topic"         # one line: a long random topic name

[ai]
url = "http://127.0.0.1:8771"                  # ai/bigeye-ai.py

[camera_machine]
# The machine that hosts the camera Wi-Fi, the bridges and the stand-in clouds.
# Leave ssh empty when that is this machine (one-machine mode).
ssh = []                                       # e.g. ["ssh", "-o", "BatchMode=yes", "cameras"]
ssh_fallback = []
stand_in_media_url = ""                        # the 360 stand-in's caught uploads, e.g. "http://127.0.0.1:18081"
logs = ["~/bigeye-fakecloud.log", "~/.cache/bigeye-iwfcloud.log", "~/bigeye-360-media/reports.jsonl"]

# One table per camera. ip = its address on the camera Wi-Fi (the call-home monitor uses it),
# unit = its bridge service (the Reconnect button and auto-fix restart it).
[cameras.cam360]
ip = "10.42.0.172"
unit = "bigeye-bridge-cam360"

[cameras.door]
ip = "10.42.0.136"
unit = "bigeye-bridge-door"

[ptz]
seed_presets = []                              # e.g. [{ name = "sofa", x = 0.48, y = 0.9 }]

[windows]
explorer = "/mnt/c/Windows/explorer.exe"       # WSL only: the folder buttons open Windows Explorer
